<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/admin/_admin.css">
  <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet">
  <style>
    .be-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
    .be-sum .k{background:#fff;border:1px solid #e3e9ee;border-radius:12px;padding:12px 16px;min-width:0;cursor:pointer;transition:border-color .15s;}
    .be-sum .k:hover{border-color:#cc0a2b;}
    .be-sum .k.on{border-color:#cc0a2b;background:#fff5f6;}
    .be-sum .k .t{font-size:12px;color:#6b7f84;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .be-sum .k .v{font-size:22px;font-weight:800;color:#16202a;margin-top:3px;}
    .be-sum .k .v small{font-size:13px;font-weight:600;color:#6b7f84;}
    .be-filtry{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
    .be-filtry select{max-width:230px;}
    .be-filtry .search-box{flex:1 1 260px;}
    .be-licznik{font-size:13px;color:#6b7f84;margin-left:auto;white-space:nowrap;}
    .be-sub{font-size:12px;color:#6b7f84;}
    .be-pag{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 0 0;font-size:13px;color:#6b7f84;flex-wrap:wrap;}
    .be-pag select{width:auto;padding:5px 8px;font-size:12px;}
    .be-tag{display:inline-block;background:#f2f4f6;color:#46535f;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;}
    .be-tag.jst{background:#e3f2fd;color:#1565c0;}
    .be-tag.firma{background:#f2f4f6;}
    .be-tag.nauka{background:#f3e8fd;color:#6a1b9a;}
    .be-tag.adm{background:#fff3e0;color:#e65100;}
    .be-tag.kom{background:#e6f5ec;color:#1d7a45;}
    td.be-email{white-space:nowrap;}
    td.be-firma{max-width:280px;}
    .be-firma .osoba{font-size:12px;color:#6b7f84;}
    .be-www a{font-size:12px;}
    .badge-unsubscribed{background:#f2f4f6;color:#8b98a4;text-decoration:line-through;}
    .badge-bounced{background:#fdecef;color:#a3122c;}
    /* komunikat błędu wewnątrz okna dodawania/edycji adresu */
    .ed-err{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;background:#fdecef;border:1px solid #f3ccd4;color:#a3122c;font-size:13px;}
    .ed-err.show{display:block;}
    /* znacznik: wpis edytowany w panelu — chroniony przed nadpisaniem przy imporcie */
    .be-tag.panel{background:#eaf3ff;color:#1558b0;}
    /* filtry wielokrotnego wyboru (checkbox-dropdown) */
    .ms{position:relative;}
    .ms-btn{cursor:pointer;text-align:left;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;padding-right:26px;}
    .ms-btn::after{content:'▾';position:absolute;right:10px;color:#8b98a4;font-size:11px;pointer-events:none;}
    .ms-btn.ms-on{border-color:#cc0a2b;color:#16202a;font-weight:600;}
    .ms-menu{position:absolute;z-index:60;top:calc(100% + 4px);left:0;min-width:240px;max-height:340px;overflow:auto;background:#fff;border:1px solid #d6dde3;border-radius:8px;box-shadow:0 8px 24px rgba(22,32,42,.16);padding:8px;}
    .ms-head{font-size:12px;padding:2px 6px 8px;border-bottom:1px solid #eef2f5;margin-bottom:6px;color:#6b7f84;}
    .ms-head a{color:#cc0a2b;cursor:pointer;font-weight:600;}
    .ms-opt{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:13px;cursor:pointer;}
    .ms-opt:hover{background:#f6f8fa;}
    .ms-opt input{width:15px;height:15px;accent-color:#cc0a2b;flex:none;}
    .ms-opt .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ms-opt .c{color:#8b98a4;font-size:12px;}
    .ms-empty{color:#8b98a4;font-size:12px;padding:6px;}
    .btn.btn-ghost.btn-sm.be-clear{border:1px solid var(--border);}
  </style>
</head>

  <script>
    /* Słowniki z pliku źródłowego (arkusz „Listy"). Do list w filtrach i formularzu
       dokładamy też wartości, które faktycznie występują w bazie. */
    const GRUPY   = ['JST', 'Firma', 'Spółki komunalne', 'Administracja rządowa', 'Nauka', 'Nieustalone', 'Test'];
    const RODZAJE = ['geodezja', 'inne', 'PODGiK', 'urząd miasta/gminy', 'urząd marszałkowski', 'WBGiTR', 'PWiK',
                     'GUGiK', 'WINGiK', 'urząd wojewódzki', 'administracja rządowa', 'uczelnia wyższa', 'instytut badawczy'];
    const POCHODZENIA = ['MailerLite', 'prospecting', 'formularz', 'ręcznie'];
    const KLASA_GRUPY = { 'JST':'jst', 'Firma':'firma', 'Nauka':'nauka', 'Administracja rządowa':'adm', 'Spółki komunalne':'kom' };
    const STATUS = { active:'aktywny', unsubscribed:'wypisany', bounced:'odbity' };

    let dane = [], strona = 1, kafelekGrupa = '';

    /* PostgREST zwraca maks. 1000 wierszy na zapytanie — pobieramy stronami. */
    async function pobierzWszystko() {
      const out = []; const KROK = 1000;
      for (let od = 0; ; od += KROK) {
        /* usunięte w panelu (nagrobki) są ukryte — zostają w bazie tylko po to,
           by import ich nie dodał ponownie */
        const { data, error } = await db.from('baza_email').select('*').is('usuniety_panel', null).order('email').range(od, od + KROK - 1);
        if (error) throw error;
        out.push(...(data || []));
        if (!data || data.length < KROK) break;
      }
      return out;
    }

    function maDane(r) { return !!(r.firma || r.adres || r.nip || r.telefon || r.osoba || r.www); }

    /* Pusta grupa liczy się i filtruje jako „Nieustalone” — inaczej kafelek pokazywał
       adresy z pustą grupą, a filtr po „Nieustalone” już ich nie zwracał. */
    const GRUPA_OF = r => (r.grupa && r.grupa.trim()) || 'Nieustalone';

    /* Wartości filtra + liczności, z danych. Puste (null/'') jako token „(puste)". */
    function pary(wartosci) {
      const licz = {};
      wartosci.forEach(v => { const k = (v && v.toString().trim()) ? v : '(puste)'; licz[k] = (licz[k] || 0) + 1; });
      const out = Object.keys(licz).filter(k => k !== '(puste)').sort((a, b) => licz[b] - licz[a]).map(v => ({ value: v, count: licz[v] }));
      if (licz['(puste)']) out.push({ value: '(puste)', count: licz['(puste)'] });
      return out;
    }

    /* Filtr wielokrotnego wyboru (checkbox-dropdown). Pusty wybór = wszystkie. */
    function multiSelect(hostId, etykieta, onChange) {
      const host = document.getElementById(hostId);
      let opts = [];
      const sel = new Set();
      host.innerHTML =
        '<button type="button" class="ms-btn form-control"></button>' +
        '<div class="ms-menu" hidden><div class="ms-head"><a data-all>zaznacz wszystkie</a> · <a data-none>wyczyść</a></div><div class="ms-list"></div></div>';
      const btn = host.querySelector('.ms-btn'), menu = host.querySelector('.ms-menu'), list = host.querySelector('.ms-list');
      const etyk = () => sel.size === 0 ? etykieta + ': wszystkie' : sel.size === 1 ? etykieta + ': ' + [...sel][0] : etykieta + ': ' + sel.size + ' wybrane';
      const rysujBtn = () => { btn.textContent = etyk(); btn.classList.toggle('ms-on', sel.size > 0); };
      const rysujList = () => {
        list.innerHTML = opts.length ? opts.map(o =>
          `<label class="ms-opt"><input type="checkbox" value="${esc(o.value)}" ${sel.has(o.value) ? 'checked' : ''}><span class="n">${esc(o.value)}</span><span class="c">${o.count}</span></label>`).join('')
          : '<div class="ms-empty">brak wartości</div>';
        list.querySelectorAll('input').forEach(cb => cb.addEventListener('change', () => {
          if (cb.checked) sel.add(cb.value); else sel.delete(cb.value);
          rysujBtn(); onChange();
        }));
      };
      btn.addEventListener('click', e => { e.stopPropagation(); const otworz = menu.hidden; document.querySelectorAll('.ms-menu').forEach(m => m.hidden = true); menu.hidden = !otworz; });
      menu.addEventListener('click', e => e.stopPropagation());
      host.querySelector('[data-all]').addEventListener('click', e => { e.preventDefault(); opts.forEach(o => sel.add(o.value)); rysujList(); rysujBtn(); onChange(); });
      host.querySelector('[data-none]').addEventListener('click', e => { e.preventDefault(); sel.clear(); rysujList(); rysujBtn(); onChange(); });
      rysujBtn();
      return {
        setOptions(pairs) { opts = pairs; [...sel].forEach(v => { if (!opts.some(o => o.value === v)) sel.delete(v); }); rysujList(); rysujBtn(); },
        values() { return [...sel]; },
        size() { return sel.size; },
        only(v) { sel.clear(); if (v != null && v !== '') sel.add(v); rysujList(); rysujBtn(); onChange(); },
        clear() { sel.clear(); rysujList(); rysujBtn(); },
      };
    }
    document.addEventListener('click', () => document.querySelectorAll('.ms-menu').forEach(m => m.hidden = true));

    let msPochodzenie, msGrupa, msRodzaj;
    /* Dopasowanie wiersza do multi-selecta: pusty wybór = wszystko; „(puste)" łapie brak wartości. */
    function msPasuje(ms, val) {
      if (ms.size() === 0) return true;
      const v = (val && val.toString().trim()) ? val : '(puste)';
      return ms.values().includes(v);
    }

    function filtruj() {
      const f = document.getElementById('szukaj').value.toLowerCase().trim();
      const fs = document.getElementById('fStatus').value;
      const fd = document.getElementById('fDane').value;
      const fe = document.getElementById('fEdyt').value;
      return dane.filter(r => {
        if (msGrupa.size() && !msGrupa.values().includes(GRUPA_OF(r))) return false;   // pusta grupa = „Nieustalone”
        if (!msPasuje(msPochodzenie, r.pochodzenie) || !msPasuje(msRodzaj, r.rodzaj)) return false;
        if (fs && (r.status || 'active') !== fs) return false;
        if (fe === 'tak' && !r.edytowany_panel) return false;
        if (fe === 'nie' && r.edytowany_panel) return false;
        if (fd === 'tak' && !maDane(r)) return false;
        if (fd === 'nie' && maDane(r)) return false;
        if (!f) return true;
        return [r.email, r.email2, r.email3, r.firma, r.osoba, r.adres, r.nip, r.www, r.telefon, r.uwagi]
          .some(v => (v || '').toString().toLowerCase().includes(f));
      });
    }

    function podsumuj() {
      const wg = {};
      dane.forEach(r => { const k = GRUPA_OF(r); wg[k] = (wg[k] || 0) + 1; });
      const zDanymi = dane.filter(maDane).length;
      let html = `<div class="k ${kafelekGrupa === '' ? 'on' : ''}" data-grupa=""><div class="t">Wszystkie adresy</div><div class="v">${dane.length} <small>· ${zDanymi} z danymi firmy</small></div></div>`;
      Object.entries(wg).sort((a, b) => b[1] - a[1]).forEach(([g, n]) => {
        html += `<div class="k ${kafelekGrupa === g ? 'on' : ''}" data-grupa="${esc(g)}" title="Filtruj: ${esc(g)}"><div class="t">${esc(g)}</div><div class="v">${n}</div></div>`;
      });
      const box = document.getElementById('podsumowanie');
      box.innerHTML = html;
      /* Klik w kafelek = filtr grupy na tę jedną wartość (albo „Wszystkie” czyści grupę). */
      box.querySelectorAll('.k').forEach(k => k.addEventListener('click', () => {
        if (k.dataset.grupa === '') msGrupa.only(''); else msGrupa.only(k.dataset.grupa);
      }));
    }

    /* Podświetlenie kafelków wg wyboru grupy (multi-select). */
    function odswiezKafelki() {
      const g = msGrupa ? msGrupa.values() : [];
      document.querySelectorAll('#podsumowanie .k').forEach(k => {
        const dg = k.dataset.grupa;
        const on = dg === '' ? g.length === 0 : (g.length === 1 && g[0] === dg);
        k.classList.toggle('on', on);
      });
    }

    function tag(g) { return g ? `<span class="be-tag ${KLASA_GRUPY[g] || ''}">${esc(g)}</span>` : '<span class="be-sub">—</span>'; }

    function render() {
      const rows = filtruj();
      const rozmiar = parseInt(document.getElementById('pagRozmiar').value, 10) || 50;
      const stron = Math.max(1, Math.ceil(rows.length / rozmiar));
      if (strona > stron) strona = stron;
      const od = (strona - 1) * rozmiar, wid = rows.slice(od, od + rozmiar);

      document.getElementById('licznik').textContent = rows.length === dane.length
        ? `${dane.length} adresów` : `${rows.length} z ${dane.length} adresów`;
      document.getElementById('pagInfo').textContent = rows.length ? `${od + 1}–${od + wid.length} z ${rows.length} · strona ${strona}/${stron}` : '';
      document.getElementById('pagPrev').disabled = strona <= 1;
      document.getElementById('pagNext').disabled = strona >= stron;
      odswiezKafelki();

      const tb = document.getElementById('rows');
      if (!wid.length) { tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#6b7f84;">Brak adresów spełniających kryteria.</td></tr>'; return; }
      tb.innerHTML = wid.map(r => `
        <tr>
          <td class="be-email"><strong>${esc(r.email)}</strong>${r.status && r.status !== 'active' ? ` <span class="badge badge-${esc(r.status)}">${STATUS[r.status] || r.status}</span>` : ''}${r.edytowany_panel ? ` <span class="be-tag panel" title="Edytowano w panelu ${esc(fmtDate(r.edytowany_panel))} — import tego wpisu nie nadpisze">✎ panel</span>` : ''}${(r.email2 || r.email3) ? `<div class="be-sub">+ ${[r.email2, r.email3].filter(Boolean).map(esc).join(', ')}</div>` : ''}</td>
          <td class="be-firma">${esc(r.firma || '—')}${r.osoba ? `<div class="osoba">${esc(r.osoba)}${r.stanowisko ? ' · ' + esc(r.stanowisko) : ''}</div>` : ''}</td>
          <td>${tag(r.grupa)}</td>
          <td>${esc(r.rodzaj || '—')}</td>
          <td style="max-width:220px;">${esc(r.adres || '—')}${r.nip ? `<div class="be-sub">NIP ${esc(r.nip)}</div>` : ''}</td>
          <td style="white-space:nowrap;">${esc(r.telefon || '—')}</td>
          <td class="be-www">${r.www ? `<a href="${esc(/^https?:/i.test(r.www) ? r.www : 'https://' + r.www)}" target="_blank" rel="noopener">${esc(r.www.replace(/^https?:\/\//i, ''))}</a>` : '—'}</td>
          <td class="actions"><button class="btn btn-ghost btn-xs" data-edytuj="${r.id}">✎</button></td>
        </tr>`).join('');
      tb.querySelectorAll('[data-edytuj]').forEach(b => b.addEventListener('click', () => otworz(b.dataset.edytuj)));
    }

    /* ── edycja ── */
    function wypelnijSelect(sel, kanon, biezaca) {
      const lista = [...new Set([...kanon, ...dane.map(r => sel.id === 'edGrupa' ? r.grupa : r.rodzaj).filter(Boolean)])];
      if (biezaca && !lista.includes(biezaca)) lista.push(biezaca);
      sel.innerHTML = '<option value="">— nie ustalono —</option>' + lista.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
      sel.value = biezaca || '';
    }
    function otworz(id) {
      const r = id ? dane.find(x => x.id === id) : null;
      document.getElementById('edTytul').textContent = r ? r.email : 'Nowy adres';
      document.getElementById('edId').value = r ? r.id : '';
      const v = (k) => (r && r[k]) || '';
      edEmail.value = v('email'); edEmail2.value = v('email2'); edEmail3.value = v('email3');
      edPochodzenie.value = r ? v('pochodzenie') : 'ręcznie';
      wypelnijSelect(edGrupa, GRUPY, v('grupa')); wypelnijSelect(edRodzaj, RODZAJE, v('rodzaj'));
      edFirma.value = v('firma'); edAdres.value = v('adres'); edNip.value = v('nip'); edTelefon.value = v('telefon');
      edOsoba.value = v('osoba'); edStanowisko.value = v('stanowisko'); edWww.value = v('www'); edUwagi.value = v('uwagi');
      edStatus.value = (r && r.status) || 'active';
      document.getElementById('edMeta').textContent = r
        ? [r.pewnosc ? 'pewność danych: ' + r.pewnosc : '', r.zrodlo ? 'źródło: ' + r.zrodlo : '',
           'dodano ' + fmtDate(r.created_at), r.edytowany_panel ? 'edytowano w panelu ' + fmtDate(r.edytowany_panel) + ' — chroniony przed importem' : '']
          .filter(Boolean).join(' · ')
        : '';
      document.getElementById('edUsun').style.display = r ? '' : 'none';
      document.getElementById('edErr').classList.remove('show');   // czysto przy każdym otwarciu
      openModal('edModal');
    }
    function bladEd(msg){ const e = document.getElementById('edErr'); e.textContent = msg; e.classList.add('show'); }
    async function zapisz() {
      document.getElementById('edErr').classList.remove('show');
      const mail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
      const email = edEmail.value.trim().toLowerCase();
      const email2 = edEmail2.value.trim().toLowerCase();
      const email3 = edEmail3.value.trim().toLowerCase();
      if (!mail.test(email)) { bladEd('Podaj poprawny adres e-mail główny.'); edEmail.focus(); return; }
      if (email2 && !mail.test(email2)) { bladEd('Drugi adres e-mail jest niepoprawny.'); edEmail2.focus(); return; }
      if (email3 && !mail.test(email3)) { bladEd('Trzeci adres e-mail jest niepoprawny.'); edEmail3.focus(); return; }
      const p = (el) => (el.value || '').trim() || null;
      const teraz = new Date().toISOString();
      const rec = { email, email2: email2 || null, email3: email3 || null, pochodzenie: p(edPochodzenie), grupa: p(edGrupa), rodzaj: p(edRodzaj), firma: p(edFirma), adres: p(edAdres),
                    nip: p(edNip), telefon: p(edTelefon), osoba: p(edOsoba), stanowisko: p(edStanowisko), www: p(edWww),
                    uwagi: p(edUwagi), status: edStatus.value, updated_at: teraz,
                    /* każdy zapis z panelu chroni wpis przed nadpisaniem przy imporcie */
                    edytowany_panel: teraz };
      const id = document.getElementById('edId').value;
      const btn = document.getElementById('edZapisz'); btn.disabled = true;
      const res = id ? await db.from('baza_email').update(rec).eq('id', id) : await db.from('baza_email').insert(rec);
      btn.disabled = false;
      if (res.error) {
        console.error(res.error);
        if (/duplicate|unique/i.test(res.error.message)) { bladEd('Ten adres już jest w bazie — nie dodano drugi raz.'); edEmail.focus(); }
        else bladEd('Nie udało się zapisać: ' + res.error.message);
        return;
      }
      toast('Zapisano', 'success'); closeModal('edModal'); load();
    }
    /* Miękkie usunięcie: wpis znika z listy, ale zostaje w bazie jako nagrobek,
       żeby kolejny import nie dodał tego adresu z powrotem. */
    async function usun() {
      const id = document.getElementById('edId').value; if (!id) return;
      if (!confirm('Usunąć ten adres? Zniknie z listy i NIE wróci przy kolejnym imporcie bazy.')) return;
      const teraz = new Date().toISOString();
      const { error } = await db.from('baza_email').update({ usuniety_panel: teraz, edytowany_panel: teraz }).eq('id', id);
      if (error) { toast('Błąd usuwania', 'error'); console.error(error); return; }
      toast('Usunięto — nie wróci przy imporcie', 'success'); closeModal('edModal'); load();
    }

    async function load() {
      try { dane = await pobierzWszystko(); }
      catch (e) { console.error(e); toast('Błąd ładowania bazy (czy uruchomiono supabase_baza_email.sql?)', 'error'); return; }
      msPochodzenie.setOptions(pary(dane.map(r => r.pochodzenie)));
      msGrupa.setOptions(pary(dane.map(GRUPA_OF)));
      msRodzaj.setOptions(pary(dane.map(r => r.rodzaj)));
      document.getElementById('dlPochodzenie').innerHTML = [...new Set([...POCHODZENIA, ...dane.map(r => r.pochodzenie).filter(Boolean)])].map(v => `<option value="${esc(v)}">`).join('');
      podsumuj(); render();
    }

    (async () => {
      if (!await requireAuth()) return;
      const przefiltruj = () => { strona = 1; render(); };
      msPochodzenie = multiSelect('msPochodzenie', 'Pochodzenie', przefiltruj);
      msGrupa       = multiSelect('msGrupa', 'Grupa', przefiltruj);
      msRodzaj      = multiSelect('msRodzaj', 'Rodzaj/branża', przefiltruj);
      document.getElementById('szukaj').addEventListener('input', przefiltruj);
      ['fStatus', 'fDane', 'fEdyt', 'pagRozmiar'].forEach(id => document.getElementById(id).addEventListener('change', przefiltruj));
      document.getElementById('btnClear').addEventListener('click', () => {
        msPochodzenie.clear(); msGrupa.clear(); msRodzaj.clear();
        ['szukaj', 'fStatus', 'fDane', 'fEdyt'].forEach(id => document.getElementById(id).value = '');
        przefiltruj();
      });
      document.getElementById('pagPrev').addEventListener('click', () => { strona--; render(); });
      document.getElementById('pagNext').addEventListener('click', () => { strona++; render(); });
      document.getElementById('btnNowy').addEventListener('click', () => otworz(null));
      document.getElementById('edZapisz').addEventListener('click', zapisz);
      document.getElementById('edUsun').addEventListener('click', usun);

      document.getElementById('btnCsv').addEventListener('click', () => {
        const rows = filtruj();
        if (!rows.length) { toast('Brak danych do eksportu'); return; }
        exportCSV(rows.map(r => ({ ...r, status: STATUS[r.status] || r.status,
                                   edytowany_panel: r.edytowany_panel ? fmtDate(r.edytowany_panel) : '' })), [
          { key:'email', label:'E-mail' }, { key:'email2', label:'E-mail 2' }, { key:'email3', label:'E-mail 3' }, { key:'pochodzenie', label:'Pochodzenie' }, { key:'grupa', label:'Grupa' },
          { key:'rodzaj', label:'Rodzaj/branża' }, { key:'firma', label:'Firma / instytucja' }, { key:'adres', label:'Adres' },
          { key:'nip', label:'NIP' }, { key:'telefon', label:'Telefon' }, { key:'osoba', label:'Osoba kontaktowa' },
          { key:'stanowisko', label:'Stanowisko' }, { key:'www', label:'WWW' }, { key:'pewnosc', label:'Pewność' },
          { key:'status', label:'Status' }, { key:'edytowany_panel', label:'Edytowano w panelu' }, { key:'uwagi', label:'Uwagi' },
        ], 'baza-email-gig.csv');
      });

      /* Mail do przefiltrowanych (bez wypisanych i odbitych). Funkcja wysyłkowa ma limit 200
         adresów — do masowej wysyłki służy MailerLite, tu wysyłamy do wąskich grup. */
      document.getElementById('btnMail').addEventListener('click', () => {
        // każda firma może mieć do 3 adresów — wysyłamy do wszystkich (dedup po stronie funkcji)
        const odb = filtruj().filter(r => !r.status || r.status === 'active').flatMap(r =>
          [r.email, r.email2, r.email3].filter(Boolean).map(e => ({ email: e, name: r.osoba || r.firma || '', id: r.id })));
        if (!odb.length) { toast('Brak aktywnych odbiorców w bieżącym filtrze'); return; }
        if (odb.length > 200) { toast(`Za dużo odbiorców (${odb.length}). Zawęź filtr do maks. 200 adresów — masowe wysyłki rób w MailerLite.`, 'error', 7000); return; }
        const opisy = [];
        if (msPochodzenie.size()) opisy.push('źródło: <strong>' + esc(msPochodzenie.values().join(', ')) + '</strong>');
        if (msGrupa.size()) opisy.push('grupa: <strong>' + esc(msGrupa.values().join(', ')) + '</strong>');
        if (msRodzaj.size()) opisy.push('branża: <strong>' + esc(msRodzaj.values().join(', ')) + '</strong>');
        gigKreatorMaila({ odbiorcy: odb, rodzaj: 'baza', opis: opisy.join(' · ') || '<strong>bieżący filtr</strong>' });
      });

      /* Kampania: zapisuje treść i kolejkę odbiorców; wysyłka rusza w zakładce „Wysyłki”
         — porcjami, z limitem dziennym, bez limitu 200 i bez ryzyka dubli. */
      document.getElementById('btnKampania').addEventListener('click', () => {
        const odb = filtruj().filter(r => !r.status || r.status === 'active').flatMap(r =>
          [r.email, r.email2, r.email3].filter(Boolean).map(e => ({ email: e, name: r.osoba || r.firma || '', id: r.id })));
        if (!odb.length) { toast('Brak aktywnych odbiorców w bieżącym filtrze'); return; }

        const czesci = [];
        if (msPochodzenie.size()) czesci.push('źródło: ' + msPochodzenie.values().join(', '));
        if (msGrupa.size())       czesci.push('grupa: ' + msGrupa.values().join(', '));
        if (msRodzaj.size())      czesci.push('branża: ' + msRodzaj.values().join(', '));
        const szukaj = document.getElementById('szukaj').value.trim();
        if (szukaj) czesci.push('szukaj: ' + szukaj);
        const opisFiltra = czesci.join(' · ') || 'cała baza';

        gigKreatorMaila({
          odbiorcy: odb, rodzaj: 'baza',
          etykietaWyslij: '📣 Utwórz kampanię',
          opis: `<strong>${esc(opisFiltra)}</strong> — wysyłka porcjami, z limitem dziennym`,
          zamiastWysylki: async ({ temat, html, odbiorcy }) => {
            const sesja = await getSession();
            const { data: kamp, error: e1 } = await db.from('wysylki').insert({
              temat, html, opis_filtra: opisFiltra, status: 'robocza', limit_dzienny: 200,
              utworzyl: sesja && sesja.user ? sesja.user.email : null
            }).select('id').single();
            if (e1) throw e1;
            const wiersze = odbiorcy.map(o => ({ wysylka_id: kamp.id, email: o.email, baza_email_id: o.id || null }));
            for (let i = 0; i < wiersze.length; i += 500) {
              const { error: e2 } = await db.from('wysylki_odbiorcy').insert(wiersze.slice(i, i + 500));
              if (e2) throw e2;
            }
            toast('Kampania utworzona: ' + wiersze.length + ' adresów', 'success');
            window.location.href = 'wysylki.html';
          }
        });
      });

      load();
    })();
  </script>
</body>
</html>
