<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Szkolenia — Panel GIG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-logo">
        <a class="logo-badge" href="dashboard.html">
          <span class="logo-icon">GIG</span>
          <span class="logo-text">Panel GIG<span>Geodezyjna Izba Gospodarcza</span></span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Zarządzanie</div>
        <a href="dashboard.html"><span class="nav-icon">▦</span> Pulpit</a>
        <a href="formularze.html#newsletter"><span class="nav-icon">✉</span> Newsletter <span class="nav-badge" id="navBadgeNewsletter" style="display:none">0</span></a>
        <a href="baza-email.html"><span class="nav-icon">📇</span> Baza e-mail</a>
        <a href="wysylki.html"><span class="nav-icon">📣</span> Wysyłki</a>
        <a href="formularze.html#kontakt"><span class="nav-icon">☎</span> Kontakt <span class="nav-badge" id="navBadgeKontakt" style="display:none">0</span></a>
        <a href="zapisy.html"><span class="nav-icon">✓</span> Zapisy na szkolenia <span class="nav-badge" id="navBadgeZapisy" style="display:none">0</span></a>
        <a href="artykuly.html"><span class="nav-icon">✎</span> Artykuły</a>
        <a href="szkolenia.html"><span class="nav-icon">🎓</span> Szkolenia</a>
        <a href="czlonkowie.html"><span class="nav-icon">⚇</span> Członkowie</a>
        <div class="nav-section">Strona</div>
        <a href="/szkolenia/" target="_blank"><span class="nav-icon">↗</span> Zobacz stronę</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="user-avatar" id="userAvatar">A</span>
          <div class="user-info"><div class="user-name" id="userName">admin</div><div class="user-role">Administrator</div></div>
          <button class="btn-logout" data-action="logout" title="Wyloguj">⏻</button>
        </div>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-title">Szkolenia</div>
        <div class="topbar-actions"><button class="btn btn-primary btn-sm" id="newBtn">+ Nowe szkolenie</button></div>
      </header>
      <main class="admin-content">
        <div class="card"><div class="card-body">
          <div class="table-wrap">
            <table class="admin-table">
              <thead><tr><th>Termin</th><th>Tytuł</th><th>Miejsce</th><th>Zgłoszeń</th><th>Status</th><th></th></tr></thead>
              <tbody id="rows"><tr><td colspan="6" style="text-align:center;padding:24px;color:#6b7f84;">Ładowanie…</td></tr></tbody>
            </table>
          </div>
        </div></div>
      </main>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Nowe szkolenie</div>
        <button class="modal-close" data-modal-close="editModal">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="sId">
        <div class="form-group"><label>Tytuł szkolenia</label><input type="text" id="sTitle" class="form-control"></div>
        <div class="grid-2">
          <div class="form-group"><label>Data od</label><input type="date" id="sStart" class="form-control"></div>
          <div class="form-group"><label>Data do (opcjonalnie)</label><input type="date" id="sEnd" class="form-control"></div>
        </div>
        <div class="grid-2">
          <div class="form-group"><label>Miejsce</label><input type="text" id="sLocation" class="form-control" placeholder="np. Warszawa, ul. Czackiego 3/5"></div>
          <div class="form-group"><label>Status</label>
            <select id="sStatus" class="form-control">
              <option value="published">Opublikowane (widoczne)</option>
              <option value="draft">Szkic (ukryte)</option>
              <option value="archived">Zarchiwizowane</option>
            </select></div>
        </div>
        <label class="form-group" style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="sOnline" style="width:auto;"> Szkolenie online (zamiast miejsca)
        </label>
        <div class="form-group"><label>Godziny <span style="font-weight:400;color:#7a8794">— np. 09:00–14:00</span></label><input type="text" id="sTime" class="form-control" placeholder="09:00–14:00"></div>
        <div class="form-group"><label>Termin opisowy <span style="font-weight:400;color:#7a8794">— wpisz tylko, gdy nie znasz dokładnej daty, np. „Październik 2026 — termin wkrótce”. Zastąpi datę na kafelku; pole Data od służy wtedy do ustawienia kolejności.</span></label><input type="text" id="sDateLabel" class="form-control" placeholder="Październik 2026 — termin wkrótce"></div>
        <div class="form-group"><label>Opis <span style="font-weight:400;color:#7a8794">— dla kogo szkolenie, co uczestnik zyska. Pusta linia rozdziela akapity.</span></label><textarea id="sDesc" class="form-control" rows="5" placeholder="Krótki opis szkolenia…"></textarea></div>
        <div class="form-group"><label>Program <span style="font-weight:400;color:#7a8794">— jeden punkt w linii, wyświetli się jako lista</span></label><textarea id="sAgenda" class="form-control" rows="6" placeholder="Analiza materiałów źródłowych&#10;Ustalanie przebiegu granic&#10;Część warsztatowa"></textarea></div>
        <div class="grid-2">
          <div class="form-group"><label>Cena</label><input type="text" id="sPrice" class="form-control" placeholder="400 zł"></div>
          <div class="form-group"><label>Cena dla członków GIG</label><input type="text" id="sPriceM" class="form-control" placeholder="250 zł"></div>
        </div>
        <div class="form-group"><label>Wykładowca</label><input type="text" id="sLect" class="form-control" placeholder="dr hab. inż. Jan Kowalski, prof. AGH"></div>
        <div class="form-group"><label>O wykładowcy <span style="font-weight:400;color:#7a8794">— kilka zdań</span></label><textarea id="sLectBio" class="form-control" rows="3"></textarea></div>
        <div class="form-group"><label>Link do profilu wykładowcy</label><input type="text" id="sLectUrl" class="form-control" placeholder="https://…"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-modal-close="editModal">Anuluj</button>
        <button class="btn btn-primary" id="saveBtn">Zapisz</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/_assets/js/gig-config.js"></script>
<script src="/admin/_admin.js"></script>
  <script>
    let data = [], zapisy = {};
    const fmtDay = iso => iso ? new Date(iso+'T00:00:00').toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';

    /* Zgłoszenia łączą się ze szkoleniem po tytule (formularz /zapisy/ dostaje go w ?szkolenie=),
       więc porównujemy bez wielkości liter i spacji na końcach — drobna korekta tytułu
       w panelu nie „gubi” wcześniejszych zgłoszeń. */
    const klucz = t => (t||'').trim().toLowerCase();
    function komorkaZgloszen(r){
      const z = zapisy[klucz(r.title)];
      if(!z) return '<span style="color:#b0bec5;">—</span>';
      return `<a href="zapisy.html?szkolenie=${encodeURIComponent(r.title)}" title="Pokaż zgłoszenia na to szkolenie" style="white-space:nowrap;">
        <strong>${z.zgloszen}</strong> <span style="color:#6b7f84;">· ${z.osob} os.</span></a>`;
    }

    function termin(r){
      if(!r.date_start) return '—';
      return r.date_end && r.date_end!==r.date_start ? fmtDay(r.date_start)+' – '+fmtDay(r.date_end) : fmtDay(r.date_start);
    }
    /* Szkolenie „minęło”, gdy jego OSTATNI dzień jest wcześniejszy niż dziś —
       kilkudniowe szkolenie zostaje w aktualnych do końca ostatniego dnia.
       Wpisy bez daty (np. sam „termin opisowy”) trafiają do aktualnych, na koniec. */
    const dzisISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
    const koniec = r => r.date_end || r.date_start || '';
    function grupy(){
      const dzis = dzisISO(), akt = [], min = [];
      data.forEach(r => (koniec(r) && koniec(r) < dzis ? min : akt).push(r));
      // aktualne: najbliższe na górze, bez daty na końcu; minione: najświeższe na górze
      akt.sort((a,b)=>{ const x=a.date_start||'', y=b.date_start||''; if(!x) return 1; if(!y) return -1; return x<y?-1:x>y?1:0; });
      min.sort((a,b)=>{ const x=koniec(a), y=koniec(b); return x<y?1:x>y?-1:0; });
      return { akt, min };
    }

    function render(){
      const tb=document.getElementById('rows');
      if(!data.length){ tb.innerHTML='<tr><td colspan="6" style="text-align:center;padding:24px;color:#6b7f84;">Brak szkoleń. Kliknij „+ Nowe szkolenie”.</td></tr>'; return; }
      const badge=s=>s==='published'?'published':(s==='draft'?'draft':'archived');
      const label=s=>s==='published'?'opublikowane':(s==='draft'?'szkic':'archiwum');
      const wiersz = r=>`
        <tr>
          <td style="white-space:nowrap;">${termin(r)}</td>
          <td><strong>${esc(r.title)}</strong></td>
          <td>${r.is_online?'<em>online</em>':esc(r.location||'—')}</td>
          <td>${komorkaZgloszen(r)}</td>
          <td><span class="badge badge-${badge(r.status)}">${label(r.status)}</span></td>
          <td class="actions">
            <button class="btn btn-ghost btn-xs" data-edit="${r.id}">✎ Edytuj</button>
            <button class="btn btn-danger btn-xs" data-del="${r.id}">🗑</button>
          </td>
        </tr>`;
      const naglowek = (t,n,kolor)=>`
        <tr><td colspan="6" style="background:#f5f7f9;border-top:2px solid ${kolor};padding:10px 12px;">
          <strong style="color:${kolor};text-transform:uppercase;letter-spacing:.04em;font-size:12px;">${t}</strong>
          <span style="color:#6b7f84;font-size:12px;"> · ${n}</span>
        </td></tr>`;
      const pusto = t=>`<tr><td colspan="6" style="text-align:center;padding:14px;color:#9bacb4;font-size:13px;">${t}</td></tr>`;
      const { akt, min } = grupy();
      tb.innerHTML =
        naglowek('Aktualne', akt.length ? `${akt.length} — najbliższe na górze` : 'brak', '#cc0a2b') +
        (akt.length ? akt.map(wiersz).join('') : pusto('Brak zaplanowanych szkoleń.')) +
        naglowek('Już się odbyły', min.length ? `${min.length}` : 'brak', '#8a99a3') +
        (min.length ? min.map(wiersz).join('') : pusto('Brak archiwalnych szkoleń.'));
      tb.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditor(b.dataset.edit)));
      tb.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>del(b.dataset.del)));
    }
    function openEditor(id){
      const s=id?data.find(x=>x.id===id):null;
      modalTitle.textContent=s?'Edytuj szkolenie':'Nowe szkolenie';
      sId.value=s?s.id:''; sTitle.value=s?s.title||'':''; sStart.value=s?s.date_start||'':''; sEnd.value=s?s.date_end||'':'';
      sLocation.value=s?s.location||'':''; sStatus.value=s?s.status||'published':'published'; sOnline.checked=s?!!s.is_online:false; sDesc.value=s?s.description||'':''; sTime.value = s ? (s.time_range || '') : ''; sDateLabel.value = s ? (s.date_label || '') : ''; sAgenda.value = s ? (s.agenda || '') : ''; sPrice.value = s ? (s.price || '') : ''; sPriceM.value = s ? (s.price_member || '') : ''; sLect.value = s ? (s.lecturer || '') : ''; sLectBio.value = s ? (s.lecturer_bio || '') : ''; sLectUrl.value = s ? (s.lecturer_url || '') : '';
      openModal('editModal');
    }
    async function save(){
      const title=sTitle.value.trim();
      if(!title){ toast('Podaj tytuł','error'); return; }
      const pusteNaNull = v => { const t=(v||'').trim(); return t ? t : null; };
      const rec={ title, date_start:sStart.value||null, date_end:sEnd.value||null,
        location:sOnline.checked?null:(sLocation.value.trim()||null), is_online:sOnline.checked,
        description:sDesc.value.trim(), status:sStatus.value,
        time_range:pusteNaNull(sTime.value), date_label:pusteNaNull(sDateLabel.value), agenda:pusteNaNull(sAgenda.value),
        price:pusteNaNull(sPrice.value), price_member:pusteNaNull(sPriceM.value),
        lecturer:pusteNaNull(sLect.value), lecturer_bio:pusteNaNull(sLectBio.value),
        lecturer_url:pusteNaNull(sLectUrl.value),
        updated_at:new Date().toISOString() };
      const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='Zapisywanie…';
      const id=sId.value;
      const res = id ? await db.from('szkolenia').update(rec).eq('id',id) : await db.from('szkolenia').insert(rec);
      btn.disabled=false; btn.textContent='Zapisz';
      if(res.error){ console.error(res.error); toast('Błąd zapisu','error'); return; }
      toast('Zapisano','success'); closeModal('editModal'); load();
    }
    async function del(id){
      if(!confirm('Usunąć to szkolenie?')) return;
      const {error}=await db.from('szkolenia').delete().eq('id',id);
      if(error){ toast('Błąd usuwania','error'); return; }
      toast('Usunięto','success'); load();
    }
    async function load(){
      const [szk, zap] = await Promise.all([
        db.from('szkolenia').select('*').order('date_start',{ascending:false}),
        db.from('zapisy_szkolenia').select('szkolenie,liczba_osob,uczestnicy,status'),
      ]);
      if(szk.error){ toast('Błąd ładowania (czy uruchomiłeś supabase_szkolenia.sql?)','error'); console.error(szk.error); return; }
      data=szk.data||[];
      /* liczba zgłoszeń i osób na szkolenie — bez anulowanych */
      zapisy={};
      (zap.data||[]).filter(z=>z.status!=='cancelled').forEach(z=>{
        const k=klucz(z.szkolenie); if(!k) return;
        const w=zapisy[k]||(zapisy[k]={zgloszen:0,osob:0});
        w.zgloszen++; w.osob+=gigLiczbaOsob(z);
      });
      render();
    }
    (async()=>{
      if(!await requireAuth()) return;
      document.getElementById('newBtn').addEventListener('click',()=>openEditor(null));
      document.getElementById('saveBtn').addEventListener('click',save);
      load();
    })();
  </script>
</body>
</html>
