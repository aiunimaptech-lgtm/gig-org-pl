# GIG: odświeżanie treści z bazy zapisanej w HTML (skrypty/prerender.mjs).
# Co godzinę pobiera szkolenia, katalog Członków i wpisy z panelu; commit powstaje
# tylko wtedy, gdy coś się zmieniło, a Vercel wdraża go jak każdy inny.
# Gdy baza nie odpowiada, generator niczego nie zmienia, więc nie ma commita.
# Ręcznie: GitHub → Actions → „Prerender treści z bazy” → Run workflow
# (albo z terminala: gh workflow run prerender.yml).
name: Prerender treści z bazy

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generuj HTML z bazy
        run: node skrypty/prerender.mjs
      - name: Zapisz zmiany
        run: |
          git config user.name "gig-prerender"
          git config user.email "prerender@gig.org.pl"
          git add -A strona
          if git diff --cached --quiet; then
            echo "Brak zmian w treści."
            exit 0
          fi
          git commit -m "Prerender: aktualizacja treści z bazy"
          git pull --rebase --autostash origin main
          git push
